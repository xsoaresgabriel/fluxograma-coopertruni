<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coopertruni — Fluxo Operacional</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-mark">CT</div>
    Coopertruni
    <span class="logo-ver">v1.0</span>
  </div>
</header>

<div class="app">
  <div class="canvas-wrap">
    <div id="canvas">
      <div class="flow" id="flow"></div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="panel-inner">
      <div class="p-hdr">
        <div>
          <div class="p-sector" id="p-sector"></div>
          <div class="p-tit" id="p-tit"></div>
        </div>
        <button class="p-close" onclick="closePanel()" aria-label="Fechar painel">✕</button>
      </div>
      <div class="tabs">
        <div class="tab on" id="t-info" onclick="switchTab('info')">Info</div>
      </div>
      <div class="p-body">
        <div id="b-info"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
